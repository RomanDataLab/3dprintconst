<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Printing Construction Industry - Global Map & Companies</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e0e0e0; }

        /* ---- Scroll-velocity header (marquee that reacts to scroll speed) ---- */
        header {
            position: relative;
            height: 64px; overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            display: flex; align-items: center;
        }
        .velocity-track {
            display: flex; align-items: center; white-space: nowrap; will-change: transform;
            /* JS sets transform: translateX(...). Base drift handled in the rAF loop. */
        }
        .velocity-item {
            font-size: 2rem; font-weight: 800; letter-spacing: 2px; color: #fff;
            padding: 0 28px; text-transform: uppercase; display: inline-flex; align-items: center;
        }
        .velocity-item .accent { color: #e94560; margin: 0 6px; }
        /* stats overlaid on the right of the header */
        .stats-bar {
            position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
            display: flex; gap: 24px; z-index: 5;
            background: rgba(10,10,15,0.5); padding: 6px 16px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(4px);
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #e94560; line-height: 1.1; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: #cbd5e1; letter-spacing: 1px; }

        .layout { display: flex; height: calc(100vh - 64px); }

        #map { flex: 1; min-width: 50%; position: relative; background: #050507; }
        /* Silk Aurora sits BEHIND the map canvas (z-index 0); the dark OpenFreeMap
           canvas is made translucent so the teal aurora glows through the ocean naturally.
           No mask, no overlay z-index fight, no flicker from repaints. */
        #silk-aurora {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .maplibregl-canvas { opacity: 0.82; }
        /* dark map controls (zoom + attribution) to match the UI */
        .maplibregl-ctrl-group {
            background: rgba(10,10,15,0.5) !important; border: 1px solid #333;
        }
        .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-in,
        .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-out {
            background-color: transparent; color: #e0e0e0; width: 30px; height: 30px;
        }
        .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-in:hover,
        .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-out:hover {
            background-color: #1a1a2e; color: #fff;
        }
        .maplibregl-ctrl-attrib {
            background: rgba(10,10,15,0.5) !important; color: #999; font-size: 10px;
        }
        .maplibregl-ctrl-attrib a { color: #60a5fa; }

        /* reui c-drawer-2 style: sidebar is a fixed right-edge slide drawer over a full-width map */
        .sidebar {
            position: fixed; top: 64px; right: 0; bottom: 0;
            width: 50%; max-width: 700px; min-width: 320px;
            background: rgba(13,13,21,0.5); backdrop-filter: blur(8px);
            border-left: 1px solid rgba(255,255,255,0.3);
            box-shadow: -12px 0 40px rgba(0,0,0,0.6);
            overflow-y: auto; z-index: 1000;
            transform: translateX(0);
            transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .sidebar.closed { transform: translateX(100%); }
        /* drag handle on the drawer's left edge (swipe to close) */
        .drawer-handle {
            position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%);
            width: 6px; height: 64px; border-radius: 4px;
            background: rgba(255,255,255,0.5); cursor: ew-resize; z-index: 1001;
            transition: background 0.2s;
        }
        .drawer-handle:hover { background: #fff; }
        /* scrim that dims the map while the drawer is open */
        #drawer-scrim {
            position: fixed; inset: 64px 0 0 0; z-index: 999;
            background: rgba(0,0,0,0); pointer-events: none;
            transition: background 0.42s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #drawer-scrim.show { background: rgba(0,0,0,0.35); pointer-events: auto; }

        .controls {
            padding: 12px 16px; background: rgba(26,26,46,0.5);
            border-bottom: 1px solid #333; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .controls input, .controls select {
            padding: 8px 12px; border-radius: 6px; border: 1px solid #333;
            background: rgba(13,13,21,0.5); color: #e0e0e0; font-size: 0.85rem;
        }
        .controls input { flex: 1; min-width: 180px; }
        .controls select { min-width: 140px; }

        .company-card {
            border-bottom: 1px solid #1a1a2e; padding: 16px;
            transition: background 0.2s; cursor: pointer; background: rgba(17,17,17,0.5);
        }
        .company-card:hover { background: rgba(26,26,46,0.6); }
        .company-card.active { background: rgba(22,33,62,0.7); border-left: 3px solid #fff; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { display: flex; align-items: center; gap: 8px; }
        .card-logo { width: 20px; height: 20px; border-radius: 3px; background: #222; flex-shrink: 0; }
        /* letter badge used for every company (no external favicons) — tinted by tech type */
        .card-logo.letter-badge {
            display: flex; align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--badge, #e94560) 25%, #16213e);
            color: var(--badge, #e94560); font-size: 0.7rem; font-weight: 700;
            border: 1px solid color-mix(in srgb, var(--badge, #e94560) 60%, transparent);
        }
        .company-name { font-size: 1.05rem; font-weight: 600; color: #fff; }
        .company-status {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
            text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
        }
        .status-active { background: #0d3320; color: #4ade80; }
        .status-liquidated { background: #3b1010; color: #f87171; }

        .card-meta { display: flex; gap: 16px; font-size: 0.8rem; color: #888; margin-bottom: 8px; flex-wrap: wrap; }
        .card-meta span::before { margin-right: 4px; }

        .tech-badge {
            display: inline-block; font-size: 0.7rem; padding: 2px 8px;
            border-radius: 4px; background: #1e293b; color: #93c5fd; margin-right: 4px; margin-bottom: 4px;
        }
        .material-badge {
            display: inline-block; font-size: 0.7rem; padding: 2px 8px;
            border-radius: 4px; background: #1a2e1a; color: #86efac; margin-right: 4px; margin-bottom: 4px;
        }

        .card-links { margin-top: 8px; display: flex; gap: 12px; }
        .card-links a {
            font-size: 0.8rem; color: #60a5fa; text-decoration: none;
            display: flex; align-items: center; gap: 4px;
        }
        .card-links a:hover { color: #93c5fd; text-decoration: underline; }

        .media-container {
            margin-top: 10px; display: none;
            border-radius: 8px; overflow: hidden; background: #000; position: relative; z-index: 1;
        }
        .media-container.show { display: block; }
        .media-container iframe {
            width: 100%; aspect-ratio: 16/9; border: none;
        }
        .media-container img {
            width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
        }

        .btn-media {
            background: #e94560; color: #fff; border: none; padding: 5px 12px;
            border-radius: 4px; font-size: 0.75rem; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .btn-media:hover { background: #c73652; }

        .btn-cobod {
            background: rgba(10,10,15,0.5); border: 1px solid #333; padding: 4px;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
            display: block; margin-top: 8px; width: 100%;
        }
        .btn-cobod img { display: block; height: 20px; width: auto; margin: 0 auto; opacity: 0.6; transition: opacity 0.2s; }
        .btn-cobod .cobod-text { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #4a9eed; text-align: center; opacity: 0.6; transition: opacity 0.2s; }
        .btn-cobod.active .cobod-text { opacity: 1; color: #fff; }
        .btn-cobod:hover .cobod-text { opacity: 1; }
        .btn-cobod.active { background: rgba(26,58,107,0.7); border-color: #3b82f6; }
        .btn-cobod.active img { opacity: 1; }
        .btn-cobod:hover img { opacity: 1; }

        .legend {
            position: absolute; bottom: 30px; left: 10px; z-index: 1000;
            background: rgba(10,10,15,0.5); padding: 12px 16px; border-radius: 8px;
            border: 1px solid #333; font-size: 0.5rem; text-transform: uppercase;
            width: 250px;
        }
        .legend h4 { color: #fff; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        /* icon column: fixed left-aligned slot (biggest icon ~28px keeps icons flush left) */
        .legend-icon { font-size: 1rem; width: 32px; flex: 0 0 32px; display: flex; justify-content: flex-start; align-items: center; }
        /* text column: wider by 1/3 (min-width so long labels get full room) */
        .legend-item > span:not(.legend-icon) { flex: 1 1 auto; min-width: 168px; }
        .map-icon { font-size: 20px; line-height: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,0.8)); cursor: pointer; }
        /* PNG tech icons — monochrome source turned solid white */
        img.img-icon {
            width: 20px; height: 20px; vertical-align: middle;
            filter: brightness(0) invert(1) drop-shadow(0 0 3px rgba(0,0,0,0.8));
        }
        .legend-item img.img-icon { width: 16px; height: 16px; }
        .tech-badge img.img-icon, .popup-tech img.img-icon { width: 14px; height: 14px; }
        /* Popups have a light background — keep icons dark/original there */
        .maplibregl-popup img.img-icon { width: 14px; height: 14px; filter: none; }
        /* Delta icon scaled 2x in every context */
        img.img-icon[src*="icon-delta"] { width: 40px; height: 40px; }
        .legend-item img.img-icon[src*="icon-delta"] { width: 32px; height: 32px; }
        .tech-badge img.img-icon[src*="icon-delta"], .popup-tech img.img-icon[src*="icon-delta"] { width: 28px; height: 28px; }
        .maplibregl-popup img.img-icon[src*="icon-delta"] { width: 28px; height: 28px; }
        /* popup sizing parity with the old Leaflet popups */
        .maplibregl-popup-content { min-width: 200px; padding: 12px 14px; border-radius: 6px; }
        /* Colored tech markers on the map + legend (pre-tinted PNGs, native color) */
        .map-icon img.marker-img {
            width: 28px; height: 28px; vertical-align: middle;
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
            cursor: pointer;
        }
        .map-icon img.marker-img[src*="c-delta"] { width: 48px; height: 48px; }  /* delta 2x */
        .legend-item img.marker-img {
            width: 20px; height: 20px; vertical-align: middle;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
        }
        .legend-item img.marker-img[src*="c-delta"] { width: 28px; height: 28px; }

        /* ---- Collapsible / draggable legend + company-list toggle ---- */
        /* Bar with title + chevron stays fixed at the bottom-left; the items panel
           expands upward from it, so the toggle button never moves on collapse. */
        .legend-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .legend-bar h4 { margin: 0; white-space: nowrap; }
        .legend-body {
            position: absolute; bottom: 100%; left: 0; width: 100%;
            margin-bottom: 8px; padding: 12px 16px;
            background: rgba(10,10,15,0.5); border: 1px solid #333; border-radius: 8px;
        }
        .legend-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; padding: 0; flex-shrink: 0;
            background: rgba(255,255,255,0.08); color: #fff;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 5px;
            cursor: pointer; transition: background 0.15s;
        }
        .legend-toggle:hover { background: rgba(255,255,255,0.18); }
        .legend-toggle svg { display: block; transition: transform 0.2s; }
        .legend.collapsed .legend-toggle svg { transform: rotate(180deg); }
        /* legend: draggable + collapsible */
        .legend.leaf-drag { cursor: grab; }
        .legend.leaf-drag.dragging { cursor: grabbing; }
        .legend.leaf-drag .legend-body { cursor: default; }
        .legend.collapsed .legend-body,
        .legend.collapsed #btn-cobod { display: none; }
        /* floating toggle to re-open the drawer once it's rolled out */
        #list-toggle {
            position: fixed; top: 50%; right: 0; transform: translateY(-50%);
            width: 28px; height: 80px; border-radius: 8px 0 0 8px;
            background: rgba(13,13,21,0.5); border: 1px solid rgba(255,255,255,0.3);
            border-right: none; cursor: pointer; z-index: 1001;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #list-toggle:hover { background: rgba(22,33,62,0.7); }
        #list-toggle::before { /* chevron pointing into the right edge */
            content: ''; width: 0; height: 0;
            border-top: 7px solid transparent; border-bottom: 7px solid transparent;
        }
        #list-toggle.down::before { border-left: 9px solid #fff; }   /* open: chevron right → click to close */
        #list-toggle.up::before { border-right: 9px solid #fff; }    /* closed: chevron left → click to open */
        #list-toggle.down { right: 0; }                                 /* sits at edge while drawer open */
        /* legacy list-collapsed rules removed (drawer now floats, doesn't shrink the map) */

        #company-list { padding-bottom: 40px; }

        .no-results { padding: 40px; text-align: center; color: #666; font-size: 0.9rem; }

        @media (max-width: 900px) {
            .layout { flex-direction: column; height: auto; }
            #map { height: 50vh; min-width: 100%; }
            .sidebar { width: 100%; max-width: 100%; height: 50vh; }
        }
    </style>
</head>

    // ---- Silk Aurora: WebGL animated background over the ocean (blend-mode overlay) ----
    // Recreation of the Componentry "silk-aurora" look: flowing satin-dark ribbons,
    // pearlescent sheen, fine grain, and vignette. mix-blend-mode: lighten makes it
    // glow through the dark ocean tiles; lighter land stays mostly intact (no water-mask).
    (function setupSilkAurora() {
     try {
        const canvas = document.getElementById('silk-aurora');
        if (!canvas) return;
        const gl = canvas.getContext('webgl', { premultipliedAlpha: false, alpha: true });
        if (!gl) return;

        const vs = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos,0.0,1.0); }`;
        // Fragment shader: layered fbm-noise ribbons + pearlescent sheen + grain + vignette.
        // The canvas sits BEHIND translucent tiles, so this just paints a full aurora that
        // glows through the dark ocean tiles. No mask required.
        const fs = `precision highp float;
            uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;
            uniform vec3 u_base, u_mid, u_sheen, u_accent;
            uniform float u_intensity, u_grain, u_vignette, u_mouseInf;

            // hash + value noise + fbm
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
            float vnoise(vec2 p){
                vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
                return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
                           mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y);
            }
            float fbm(vec2 p){
                float v=0.0, a=0.5; mat2 r=mat2(0.8,0.6,-0.6,0.8);
                for(int i=0;i<6;i++){ v+=a*vnoise(p); p=r*p*2.0; a*=0.5; }
                return v;
            }
            void main(){
                vec2 uv = gl_FragCoord.xy / u_res.xy;
                vec2 p = (gl_FragCoord.xy*2.0 - u_res.xy) / min(u_res.x,u_res.y);
                // mouse-driven subtle distortion (cursor depth)
                vec2 m = (u_mouse*2.0 - 1.0);
                p += (m * 0.15) * u_mouseInf;

                float t = u_time*0.12;
                // flowing ribbons: domain-warped fbm
                vec2 q = vec2(fbm(p*1.5 + vec2(0.0,t)), fbm(p*1.5 + vec2(5.2,1.3-t)));
                float ribbons = fbm(p*1.8 + q*2.0 + vec2(t*0.6,0.0));
                ribbons = smoothstep(0.25, 0.85, ribbons);

                // pearlescent sheen: thin bright bands along the flow
                float sheen = smoothstep(0.78,0.95, fbm(p*2.4 + q*3.0 + t));

                // base gradient (deep -> secondary)
                vec3 col = mix(u_base, u_mid, ribbons);
                // aurora accent tint flowing through — bright teal that glows through the
                // translucent ocean tiles
                col = mix(col, u_accent, clamp(ribbons*0.6*u_intensity + 0.4, 0.0, 1.0));
                // pearlescent highlight
                col += u_sheen * sheen * 0.6 * u_intensity;

                // fine film grain
                float g = (hash(gl_FragCoord.xy + fract(u_time)) - 0.5) * u_grain * 0.12;
                col += g;

                // gentle vignette
                float vig = 1.0 - u_vignette * 0.3 * pow(length(uv-0.5)*1.3, 2.0);
                col *= vig;

                col = pow(col, vec3(0.95));
                gl_FragColor = vec4(col, 1.0);
            }`;
        const compile = (type, src) => {
            const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn('shader', gl.getShaderInfoLog(s));
            return s;
        };
        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog); gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const U = {
            res: gl.getUniformLocation(prog,'u_res'), time: gl.getUniformLocation(prog,'u_time'),
            mouse: gl.getUniformLocation(prog,'u_mouse'),
            base: gl.getUniformLocation(prog,'u_base'), mid: gl.getUniformLocation(prog,'u_mid'),
            sheen: gl.getUniformLocation(prog,'u_sheen'), accent: gl.getUniformLocation(prog,'u_accent'),
            intensity: gl.getUniformLocation(prog,'u_intensity'), grain: gl.getUniformLocation(prog,'u_grain'),
            vignette: gl.getUniformLocation(prog,'u_vignette'), mouseInf: gl.getUniformLocation(prog,'u_mouseInf')
        };
        const hex2rgb = h => { h=h.replace('#',''); return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]; };

        let resize = () => {
            const r = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio||1, 2);
            canvas.width = Math.max(2, Math.round(r.width*dpr));
            canvas.height = Math.max(2, Math.round(r.height*dpr));
            gl.viewport(0,0,canvas.width,canvas.height);
        };
        resize();
        window.addEventListener('resize', resize);
        // also resize when the map pane resizes (sidebar collapse, etc.)
        new ResizeObserver(resize).observe(canvas);

        let mouse = [0.5, 0.5];
        canvas.parentElement.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            mouse = [(e.clientX-r.left)/r.width, 1.0-(e.clientY-r.top)/r.height];
        });

        const start = performance.now();
        function render(){
            gl.uniform2f(U.res, canvas.width, canvas.height);
            gl.uniform1f(U.time, (performance.now()-start)/1000);
            gl.uniform2fv(U.mouse, mouse);
            gl.uniform3fv(U.base, hex2rgb('#050507'));
            gl.uniform3fv(U.mid, hex2rgb('#14151d'));
            gl.uniform3fv(U.sheen, hex2rgb('#f4dfb8'));
            gl.uniform3fv(U.accent, hex2rgb('#6ed6c9'));
            gl.uniform1f(U.intensity, 1.0);
            gl.uniform1f(U.grain, 0.85);
            gl.uniform1f(U.vignette, 1.0);
            gl.uniform1f(U.mouseInf, 1.0);
            gl.clearColor(0,0,0,1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            // setTimeout (not rAF) so the aurora keeps animating in backgrounded tabs
            setTimeout(render, 1000/30);
        }
        render();
     } catch (err) { console.warn('Silk Aurora disabled:', err); }
    })();

    // Add legend (draggable + collapsible via triangle toggle on its upper border)
    // Plain absolutely-positioned div inside #map — .legend CSS already places it

    const legend = document.createElement('div');

    {

    // Wire the legend: toggle + drag (after it's in the DOM)
    (function setupLegend() {
        const legendEl = document.querySelector('.legend.leaf-drag');
        if (!legendEl) return;

        // --- collapse / expand via the chevron in the fixed bar ---
        const toggleBtn = legendEl.querySelector('.legend-toggle');

        // --- dragging by the header (h4) area; keep map interactions out ---
        legendEl.addEventListener('mousedown', (e) => e.stopPropagation());
        legendEl.addEventListener('wheel', (e) => e.stopPropagation());
        legendEl.addEventListener('dblclick', (e) => e.stopPropagation());
        // Keep the map drag from fighting the legend drag, but don't block inner controls
        legendEl.querySelectorAll('.legend-body, .btn-cobod').forEach(el => {
            el.addEventListener('mousedown', (ev) => ev.stopPropagation());
        });

        let drag = null;
        const onDown = (e) => {
            // ignore drags that start on the toggle button or interactive children
            if (e.target.closest('.legend-toggle, .btn-cobod, a, img')) return;
            // capture viewport-relative start position (parent-agnostic)
            const r = legendEl.getBoundingClientRect();
            drag = { mx: e.clientX, my: e.clientY, lx: r.left, ly: r.top };
            legendEl.classList.add('dragging');
            e.preventDefault();
        };
        const onMove = (e) => {
            if (!drag) return;
            const mapEl = document.getElementById('map');
            const mr = mapEl.getBoundingClientRect();
            // new viewport coords for the legend's top-left
            let vx = drag.lx + (e.clientX - drag.mx);
            let vy = drag.ly + (e.clientY - drag.my);
            // clamp so the legend stays inside the map
            vx = Math.max(mr.left, Math.min(mr.right - legendEl.offsetWidth, vx));
            vy = Math.max(mr.top, Math.min(mr.bottom - legendEl.offsetHeight, vy));
            // convert viewport coords -> position relative to the legend's offset parent
            const parent = legendEl.offsetParent || document.body;
            const pr = parent.getBoundingClientRect();
            legendEl.style.left = (vx - pr.left) + 'px';
            legendEl.style.top = (vy - pr.top) + 'px';
            legendEl.style.bottom = 'auto';
            legendEl.style.right = 'auto';
        };
        const onUp = () => { if (drag) { drag = null; legendEl.classList.remove('dragging'); } };
        legendEl.addEventListener('mousedown', onDown);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    })();

    // Wire the right-edge drawer: slide in/out via the floating toggle + drag/swipe handle
    (function setupDrawer() {
        const btn = document.getElementById('list-toggle');
        const sidebar = document.querySelector('.sidebar');
        const scrim = document.getElementById('drawer-scrim');
        const handle = document.getElementById('drawer-handle');
        if (!btn || !sidebar || !scrim) return;

        const open = () => {
            sidebar.classList.remove('closed');
            scrim.classList.add('show');
            btn.classList.remove('up'); btn.classList.add('down');
            btn.title = 'Roll side panel out';
        };
        const close = () => {
            sidebar.classList.add('closed');
            scrim.classList.remove('show');
            btn.classList.remove('down'); btn.classList.add('up');
            btn.title = 'Roll side panel in';
        };
        btn.classList.add('down');           // initial: drawer open
        btn.addEventListener('click', () => sidebar.classList.contains('closed') ? open() : close());
        scrim.addEventListener('click', close);   // click the dim to close

        // drag / swipe-to-close on the left edge handle
        if (handle) {
            let dragging = null;
            const onDown = (e) => {
                const w = sidebar.offsetWidth;
                dragging = { x: (e.touches?e.touches[0].clientX:e.clientX), w };
                sidebar.style.transition = 'none';
            };
            const onMove = (e) => {
                if (!dragging) return;
                const cx = e.touches?e.touches[0].clientX:e.clientX;
                const dx = cx - dragging.x;                 // drag left → negative
                const offset = Math.min(0, Math.max(-dragging.w, dx));
                sidebar.style.transform = `translateX(${offset}px)`;
            };
            const onUp = (e) => {
                if (!dragging) return;
                const cx = (e.changedTouches?e.changedTouches[0].clientX:e.clientX);
                const dx = cx - dragging.x;
                sidebar.style.transition = ''; sidebar.style.transform = '';
                dragging = null;
                if (dx < -60) close(); else open();         // dragged >60px left → close
            };
            handle.addEventListener('mousedown', onDown);
            handle.addEventListener('touchstart', onDown, {passive:true});
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, {passive:true});
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchend', onUp);
        }
    })();

    // Markers — placed directly on the map at their TRUE coords (no clustering, no
    // permanent spiral). Overlaps are resolved dynamically in SCREEN SPACE by
    // declutter(), which pushes overlapping icons apart based on the current zoom
    // and re-runs on every zoom/pan/filter change.
    const markers = {};
    const MARKER_PX = 28;        // icon footprint used for overlap testing
    const PASSES = 30;           // relaxation passes — more passes = tighter separation

    // Only one popup open at a time (Leaflet auto-close parity)
    let openPopupIdx = null;
    function closeOtherPopups(exceptIdx) {
        if (openPopupIdx === null || openPopupIdx === exceptIdx) return;
        const prev = markers[openPopupIdx];
        if (prev && prev.marker.getPopup()?.isOpen()) prev.marker.togglePopup();

    });

    // ---- Screen-space declutter: push overlapping markers apart, zoom-aware ----
    // For every currently-visible marker, project its true latlng to layer pixels,
    // relax overlapping pairs apart in screen space, then move each marker to the
    // resulting displaced latlng. Because distances are measured in pixels at the
    // current zoom, markers spread more at low zoom (dense) and settle back to their
    // real location as you zoom in. No clustering — every marker stays on the map.
    function declutter() {
        // collect visible markers, ALWAYS projecting from their TRUE coords so
        // positions never drift cumulatively across passes / zoom changes
        const pts = [];
        for (const i in markers) {
            const m = markers[i];
            if (!m.onMap) continue;
            const p = map.project([m.trueLng, m.trueLat]);   // [lng, lat] -> px
            pts.push({ m, x: p.x, y: p.y });
        }
        const minDist = MARKER_PX * 0.9;   // overlap threshold in px
        // relaxation passes: push overlapping pairs apart along their connecting axis
        for (let pass = 0; pass < PASSES; pass++) {
            for (let a = 0; a < pts.length; a++) {
                for (let b = a + 1; b < pts.length; b++) {
                    const dx = pts[b].x - pts[a].x;
                    const dy = pts[b].y - pts[a].y;
                    const dist = Math.hypot(dx, dy) || 0.0001;
                    if (dist < minDist) {
                        // overlap amount, split evenly between the two markers
                        const push = (minDist - dist) / 2;
                        const ux = dx / dist, uy = dy / dist;
                        pts[a].x -= ux * push; pts[a].y -= uy * push;
                        pts[b].x += ux * push; pts[b].y += uy * push;
                    }
                }
            }
        }
        // apply the resolved positions back to the markers (convert px -> lnglat)
        pts.forEach(p => {
            const ll = map.unproject([p.x, p.y]);
            p.m.marker.setLngLat(ll);
        });
    }
    // re-run whenever the viewport changes (zoom/pan) — debounced via moveend.
    // setTimeout (not rAF) so it still fires when the tab is backgrounded/throttled.
    let declutterTimer = null;
    const scheduleDeclutter = () => {
        if (declutterTimer) clearTimeout(declutterTimer);
        declutterTimer = setTimeout(() => { declutterTimer = null; declutter(); }, 30);
    };
    map.on('moveend', scheduleDeclutter);
    map.on('zoomend', scheduleDeclutter);
    // first pass right away (markers are DOM elements, already placed) and again
    // once the style is fully loaded

    // ---- Scroll-velocity header marquee ----
    // Repeated text scrolls horizontally; its speed reacts to vertical scroll velocity
    // on the sidebar (the scrollable element). Fast scroll → accelerates; idle → base drift.
    (function setupVelocityHeader() {
        const track = document.getElementById('velocity-track');
        if (!track) return;
        const PHRASE = '3D PRINTING CONSTRUCTION <span class="accent">•</span> GLOBAL INDUSTRY MAP <span class="accent">•</span> ';
        // fill the track with enough copies to cover >2× viewport width
        let copies = 0;
        const fillTrack = () => {
            const targetWidth = Math.max(window.innerWidth * 2.5, 1600);
            track.innerHTML = '';
            copies = 0;
            while (track.scrollWidth < targetWidth) {
                track.insertAdjacentHTML('beforeend', `<span class="velocity-item">${PHRASE}</span>`);
                copies++;
            }
        };
        fillTrack();
        window.addEventListener('resize', fillTrack);

        const sidebar = document.querySelector('.sidebar');
        const scroller = sidebar || window;
        let offset = 0;              // current translateX (px)
        let velocity = 0;            // px/frame contribution from scroll
        let lastScroll = scroller.scrollTop ?? window.scrollY;
        let lastTime = performance.now();
        const BASE_DRIFT = 0.6;      // px/frame baseline speed when idle
        const MAX_VELOCITY = 40;     // clamp the scroll-driven boost

        scroller.addEventListener('scroll', () => {
            const now = performance.now();
            const cur = scroller.scrollTop ?? window.scrollY;
            const dy = cur - lastScroll;
            const dt = Math.max(1, now - lastTime);
            // pixels per frame (~16ms); direction-aware (down = one way, up = the other)
            const perFrame = dy / dt * 16;
            velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity + perFrame));
            lastScroll = cur;
            lastTime = now;
        });

        const itemWidth = () => track.querySelector('.velocity-item')?.offsetWidth || 400;

        function tick() {
            // velocity decays back toward the base drift each frame
            velocity *= 0.9;
            const speed = BASE_DRIFT + velocity;
            offset -= speed;          // scroll down → moves left; up → moves right
            // wrap once we've shifted one full item width (seamless loop)
            const w = itemWidth();
            if (offset <= -w) offset += w;
            if (offset >= 0) offset -= w;
            track.style.transform = `translateX(${offset}px)`;
            // setTimeout (not rAF) so the marquee keeps running in backgrounded tabs
            setTimeout(tick, 1000 / 60);
        }
        tick();
    })();

                <div class="card-links">
                    <a href="${c.web}" target="_blank">Website</a>
                    ${c.yt ? `<button class="btn-media" onclick="event.stopPropagation(); toggleMedia(${i})">&#9654; Video</button>` : c.img ? `<button class="btn-media" onclick="event.stopPropagation(); toggleMedia(${i})">&#128247; Image</button>` : ''}
                </div>
                <div class="media-container" id="media-${i}">
                    ${c.yt ? `<iframe data-src="https://www.youtube.com/embed/${getYTId(c.yt)}?rel=0" allowfullscreen loading="lazy"></iframe>` : c.img ? `<img src="${c.img}" alt="${c.name}" loading="lazy">` : ''}
                </div>
            </div>`;
        }).join('');
    }

    function flyTo(i) {
        const c = companies[i];
        map.flyTo({ center: [c.lng, c.lat], zoom: 8, duration: 1 });
        setTimeout(() => {
            const entry = markers[i];
            if (!entry || !entry.onMap) return;
            closeOtherPopups(i);
            if (!entry.marker.getPopup().isOpen()) entry.marker.togglePopup();
            openPopupIdx = i;
        }, 1000);
        document.querySelectorAll('.company-card').forEach(el => el.classList.remove('active'));
        document.getElementById('card-' + i).classList.add('active');
    }

    function toggleMedia(i) {
        const el = document.getElementById('media-' + i);
        if (!el) return;
        el.classList.toggle('show');
        if (el.classList.contains('show')) {
            const iframe = el.querySelector('iframe');
            if (iframe && !iframe.src) iframe.src = iframe.dataset.src;
        }
    }

    const cobodBtn = document.getElementById('btn-cobod');
    let cobodOnly = false;
    cobodBtn.addEventListener('click', (e) => e.stopPropagation());
    cobodBtn.addEventListener('click', () => {
        cobodOnly = !cobodOnly;
        cobodBtn.classList.toggle('active', cobodOnly);
        applyFilters();
    });

    function applyFilters() {
        const search = document.getElementById('search').value.toLowerCase();
        const tech = techSelect.value;
        const country = countrySelect.value;

        const filtered = companies.map((c, i) => ({company: c, index: i})).filter(({company: c}) => {
            if (cobodOnly && !c.equip.toLowerCase().includes('cobod')) return false;
            if (tech && c.tech !== tech) return false;
            if (country && c.country !== country) return false;
            if (search) {
                const s = `${c.name} ${c.country} ${c.city} ${c.tech} ${c.equip} ${c.material} ${c.desc}`.toLowerCase();
                if (!s.includes(search)) return false;
            }
            return true;
        });

        renderCards(filtered);

        // Update marker visibility (markers live directly on the map)
        companies.forEach((c, i) => {
            const visible = filtered.some(f => f.index === i);
            if (visible) { markers[i].marker.addTo(map); markers[i].onMap = true; }
            else { markers[i].marker.remove(); markers[i].onMap = false; }
        });
        // re-spread the visible markers so none overlap after the filter change
        scheduleDeclutter();
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    techSelect.addEventListener('change', applyFilters);
    countrySelect.addEventListener('change', applyFilters);

    // Initial render
    applyFilters();
    </script>
</body>
</html>
