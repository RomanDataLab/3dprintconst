            width: 100%; aspect-ratio: 16/9; border: none;
        }
        .media-container img {

        }

        .btn-cobod .cobod-text { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #4a9eed; text-align: center; opacity: 0.6; transition: opacity 0.2s; }
        .btn-cobod.active .cobod-text { opacity: 1; color: #fff; }

        .btn-cobod.active { background: #1a3a6b; border-color: #3b82f6; }

        {name:"CITA Copenhagen",country:"Denmark",city:"Copenhagen",lat:55.6813,lng:12.5985,tech:"R&D / Academic",equip:"COBOD BOD2, Staubli",material:"concrete",founded:2005,web:"https://royaldanishacademy.com/CITA",yt:"https://www.youtube.com/watch?v=VE4D2LcH9dE",status:"Active",desc:"Centre for IT and Architecture research"},
        {name:"ChangeMaker3D",country:"UK",city:"Worcester",lat:52.1920,lng:-2.2216,tech:"Gantry",equip:"Printfrastructure system",material:"concrete, graphene-enhanced concrete",founded:2017,web:"https://changemaker3d.co.uk/",yt:"https://www.youtube.com/watch?v=wAqXo9Ysfqw",status:"Active",desc:"3D concrete printing for rail and water infrastructure (HS2)"},
        {name:"Architectural Association (AA)",country:"UK",city:"London",lat:51.5194,lng:-0.1350,tech:"R&D / Academic",equip:"KUKA robotic arms",material:"concrete, polymers, earth-based",founded:1847,web:"https://www.aaschool.ac.uk/",yt:"https://www.youtube.com/watch?v=5s41-H8pL6Q",status:"Active",desc:"DLAB robotic fabrication and 3D printing research"},
        {name:"BAM Nuttall",country:"UK",city:"Glasgow",lat:55.8672,lng:-4.2420,tech:"Robotic Arm",equip:"Weber Beamix 3DCP",material:"concrete",founded:1874,web:"https://www.bamnuttall.co.uk/",yt:"https://www.youtube.com/watch?v=GKA1oE92YZs",status:"Active",desc:"UKs largest 3D printed concrete structure (Sighthill Bridge)"},
        {name:"Northumbria University",country:"UK",city:"Newcastle",lat:54.9783,lng:-1.6178,tech:"R&D / Academic",equip:"Luyten Platypus",material:"concrete, sustainable mixes",founded:2024,web:"https://www.northumbria.ac.uk/",yt:"",img:"https://www.offsitehub.co.uk/wp-content/uploads/2025/01/Dr-Mohammadali-Rezazadeh-Natalie-Wadley-and-Ahmed-Mahil.jpg",status:"Active",desc:"3D concrete printing research with Luyten and ChangeMaker3D"},
        {name:"LAMÁQUINA (Noumena)",country:"Spain",city:"Barcelona",lat:41.4036,lng:2.1744,tech:"Robotic Arm",equip:"ABB robotic arms, WASP printers",material:"clay, concrete, biopolymers",founded:2016,web:"https://lamaquina.io/",yt:"https://www.youtube.com/watch?v=EuH4FE6upOg",status:"Active",desc:"Large-scale robotic 3D printing factory, WASP Hub Barcelona, architectural fabrication"}
    ];

    // Extract YouTube video ID
    function getYTId(url) {
        const m = url.match(/[?&]v=([^&]+)/);
        return m ? m[1] : '';
    }

    // Tech color mapping
    const techColors = {
        'Gantry': '#3b82f6',
        'Robotic Arm': '#10b981',
        'Delta / Gantry': '#8b5cf6',
        'Gantry / Robotic Arm': '#f59e0b',
        'Robotic Arm / Tower Crane': '#06b6d4',
        'Full-stack Robotics': '#ef4444',
        'Materials Supplier': '#a855f7',
        'Robot Supplier': '#64748b',
        'R&D / Academic': '#f97316',
        'Various': '#78716c'
    };

    function getTechColor(tech) {
        return techColors[tech] || '#6b7280';
    }

    const techIcons = {
        'Gantry': '\u{1F3D7}\u{FE0F}',
        'Robotic Arm': '\u{1F9BE}',
        'Delta / Gantry': '\u{1F4D0}',
        'Gantry / Robotic Arm': '\u{1F504}',
        'Robotic Arm / Tower Crane': '\u{1F3D7}\u{FE0F}',
        'Full-stack Robotics': '\u{1F916}',
        'Materials Supplier': '\u{1F9EA}',
        'Robot Supplier': '\u{2699}\u{FE0F}',
        'R&D / Academic': '\u{1F393}',
        'Various': '\u{1F527}'
    };

    function getTechIcon(tech) {
        return techIcons[tech] || '\u{2699}\u{FE0F}';
    }

    // Init map
    const map = L.map('map', { zoomControl: true }).setView([25, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB',
        maxZoom: 19
    }).addTo(map);

    // Add legend
    const legend = L.control({position: 'bottomleft'});
    legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<h4>Technology Type</h4>';
        for (const [tech, color] of Object.entries(techColors)) {
            const icon = techIcons[tech] || '';
            div.innerHTML += `<div class="legend-item"><span class="legend-icon">${icon}</span><span style="color:${color}">${tech}</span></div>`;
        }
        const cobodImgUrl = 'https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://cobod.com&size=32';
        div.innerHTML += `<button id="btn-cobod" class="btn-cobod" title="COBOD Network"><img src="${cobodImgUrl}" alt="COBOD" onerror="this.style.display='none';this.parentElement.querySelector('.cobod-text').style.display='block'"><span class="cobod-text" style="display:none">COBOD</span></button>`;
        return div;
    };
    legend.addTo(map);

    // Markers
    const markers = {};
    companies.forEach((c, i) => {
        const color = getTechColor(c.tech);
        const icon = L.divIcon({
            html: `<span class="map-icon">${getTechIcon(c.tech)}</span>`,
            className: '',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            popupAnchor: [0, -12]
        });
        const marker = L.marker([c.lat, c.lng], { icon }).addTo(map);

        marker.bindPopup(`
            <div style="min-width:200px">
                <strong>${c.name}</strong><br>
                <span style="color:#888">${c.city}, ${c.country}</span><br>
                <span style="color:${color}">${getTechIcon(c.tech)} ${c.tech}</span> | ${c.equip}<br>
                <em>${c.material}</em><br>
                <a href="${c.web}" target="_blank">Website</a>
            </div>
        `);

        marker.on('click', () => {
            const card = document.getElementById('card-' + i);
            if (card) {
                card.scrollIntoView({behavior: 'smooth', block: 'center'});
                document.querySelectorAll('.company-card').forEach(el => el.classList.remove('active'));
                card.classList.add('active');
            }
        });
        markers[i] = marker;
    });

    // Stats
    document.getElementById('total-companies').textContent = companies.length;
    document.getElementById('total-countries').textContent = new Set(companies.map(c => c.country)).size;
    document.getElementById('total-active').textContent = companies.filter(c => c.status === 'Active').length;

    // Populate filters
    const techs = [...new Set(companies.map(c => c.tech))].sort();
    const countries = [...new Set(companies.map(c => c.country))].sort();
    const techSelect = document.getElementById('filter-tech');
    const countrySelect = document.getElementById('filter-country');
    techs.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; techSelect.appendChild(o); });
    countries.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; countrySelect.appendChild(o); });

    // Render cards
    function renderCards(filtered) {
        const list = document.getElementById('company-list');
        if (filtered.length === 0) {
            list.innerHTML = '<div class="no-results">No companies match your filters</div>';
            return;
        }
        list.innerHTML = filtered.map(({company: c, index: i}) => {
            const domain = c.web.replace(/https?:\/\//, '').replace(/\/.*/, '');
            const logo = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
            return `
            <div class="company-card" id="card-${i}" onclick="flyTo(${i})">
                <div class="card-header">
                    <div class="card-title">
                        <img class="card-logo" src="${logo}" alt="" onerror="this.style.display='none'">
                        <div class="company-name">${c.name}</div>
                    </div>
                    <span class="company-status ${c.status === 'Active' ? 'status-active' : 'status-liquidated'}">${c.status}</span>
                </div>
                <div class="card-meta">
                    <span>${c.city}, ${c.country}</span>
                    <span>Est. ${c.founded}</span>
                </div>
                <div>
                    <span class="tech-badge">${getTechIcon(c.tech)} ${c.tech}</span>
                    <span class="tech-badge">${c.equip}</span>
                </div>
                <div style="margin-top:4px">
                    ${c.material.split(',').map(m => `<span class="material-badge">${m.trim()}</span>`).join('')}
                </div>
                <div style="margin-top:4px;font-size:0.8rem;color:#999">${c.desc}</div>
                <div class="card-links">
                    <a href="${c.web}" target="_blank">Website</a>
                    ${c.yt ? `<button class="btn-media" onclick="event.stopPropagation(); toggleMedia(${i})">&#9654; Video</button>` : c.img ? `<button class="btn-media" onclick="event.stopPropagation(); toggleMedia(${i})">&#128247; Image</button>` : ''}
                </div>
                <div class="media-container" id="media-${i}">
                    ${c.yt ? `<iframe data-src="https://www.youtube.com/embed/${getYTId(c.yt)}?rel=0" allowfullscreen loading="lazy"></iframe>` : c.img ? `<img src="${c.img}" alt="${c.name}" loading="lazy">` : ''}
                </div>
            </div>`;
        }).join('');
    }

    function flyTo(i) {
        const c = companies[i];
        map.flyTo([c.lat, c.lng], 8, {duration: 1});
        markers[i].openPopup();
        document.querySelectorAll('.company-card').forEach(el => el.classList.remove('active'));
        document.getElementById('card-' + i).classList.add('active');
    }

    function toggleMedia(i) {
        const el = document.getElementById('media-' + i);
        if (!el) return;
        el.classList.toggle('show');
        if (el.classList.contains('show')) {
            const iframe = el.querySelector('iframe');
            if (iframe && !iframe.src) iframe.src = iframe.dataset.src;
        }
    }

    const cobodBtn = document.getElementById('btn-cobod');
    let cobodOnly = false;
    L.DomEvent.disableClickPropagation(cobodBtn);
    cobodBtn.addEventListener('click', () => {
        cobodOnly = !cobodOnly;
        cobodBtn.classList.toggle('active', cobodOnly);
        applyFilters();
    });

    function applyFilters() {
        const search = document.getElementById('search').value.toLowerCase();
        const tech = techSelect.value;
        const country = countrySelect.value;

        const filtered = companies.map((c, i) => ({company: c, index: i})).filter(({company: c}) => {
            if (cobodOnly && !c.equip.toLowerCase().includes('cobod')) return false;
            if (tech && c.tech !== tech) return false;
            if (country && c.country !== country) return false;
            if (search) {
                const s = `${c.name} ${c.country} ${c.city} ${c.tech} ${c.equip} ${c.material} ${c.desc}`.toLowerCase();
                if (!s.includes(search)) return false;
            }
            return true;
        });

        renderCards(filtered);

        // Update marker visibility
        companies.forEach((c, i) => {
            const visible = filtered.some(f => f.index === i);
            if (visible) { markers[i].addTo(map); }
            else { map.removeLayer(markers[i]); }
        });
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    techSelect.addEventListener('change', applyFilters);
    countrySelect.addEventListener('change', applyFilters);

    // Initial render
    applyFilters();
    </script>
</body>
</html>
